name: lockin-production

# Every container logs to stdout, so without a cap the JSON log files grow until
# they fill the host disk. Three 10 MB files per service is the whole budget.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-backend-common: &backend-common
  # Images are built and published by CI. The VPS pulls an immutable tag and
  # never builds: a Vite build peaks near 2 GB, which a 4 GB application host
  # cannot spare. Point LOCKIN_IMAGE_REPOSITORY at the registry to pull from;
  # the default keeps the local names that CI and local builds use.
  build:
    context: ./backend
  image: ${LOCKIN_IMAGE_REPOSITORY:-lockin}-backend:${LOCKIN_IMAGE_TAG:?Set LOCKIN_IMAGE_TAG}
  # "always" is what stops the host from silently building: without it, an "up"
  # that follows a failed pull falls back to the build section above. Set
  # LOCKIN_PULL_POLICY=missing only to run images you built on this machine.
  pull_policy: ${LOCKIN_PULL_POLICY:-always}
  logging: *logging
  environment: &backend-environment
    DJANGO_SETTINGS_MODULE: config.settings.production
    DJANGO_SECRET_KEY_FILE: /run/secrets/django_secret_key
    DJANGO_ALLOWED_HOSTS: ${LOCKIN_PUBLIC_HOST:?Set LOCKIN_PUBLIC_HOST}
    DJANGO_CSRF_TRUSTED_ORIGINS: https://${LOCKIN_PUBLIC_HOST:?Set LOCKIN_PUBLIC_HOST}
    DJANGO_TRUST_PROXY_SSL_HEADER: "true"
    DJANGO_TRUSTED_PROXY_CIDRS: ${DJANGO_TRUSTED_PROXY_CIDRS:-172.28.0.0/24}
    DJANGO_SECURE_HSTS_SECONDS: ${DJANGO_SECURE_HSTS_SECONDS:-3600}
    DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS: ${DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS:-true}
    DJANGO_SECURE_HSTS_PRELOAD: ${DJANGO_SECURE_HSTS_PRELOAD:-false}
    DJANGO_LOG_LEVEL: ${DJANGO_LOG_LEVEL:-INFO}
    PUBLIC_APP_URL: https://${LOCKIN_PUBLIC_HOST:?Set LOCKIN_PUBLIC_HOST}
    ACCOUNT_POLICY_VERSION: ${ACCOUNT_POLICY_VERSION:?Set ACCOUNT_POLICY_VERSION}
    DJANGO_EMAIL_BACKEND: ${DJANGO_EMAIL_BACKEND:?Set DJANGO_EMAIL_BACKEND}
    DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:?Set DEFAULT_FROM_EMAIL}
    EMAIL_HOST: ${EMAIL_HOST:?Set EMAIL_HOST}
    EMAIL_PORT: ${EMAIL_PORT:-587}
    EMAIL_HOST_USER: ${EMAIL_HOST_USER:?Set EMAIL_HOST_USER}
    EMAIL_HOST_PASSWORD_FILE: /run/secrets/email_host_password
    EMAIL_USE_TLS: ${EMAIL_USE_TLS:-true}
    EMAIL_USE_SSL: ${EMAIL_USE_SSL:-false}
    EMAIL_TIMEOUT_SECONDS: ${EMAIL_TIMEOUT_SECONDS:-10}
    # Host and port are overridable so a managed PostgreSQL provider can replace
    # the bundled database without editing this file.
    POSTGRES_DB: ${POSTGRES_DB:-lockin}
    POSTGRES_HOST: ${POSTGRES_HOST:-db}
    POSTGRES_PORT: ${POSTGRES_PORT:-5432}
    POSTGRES_RUNTIME_ROLE: ${POSTGRES_RUNTIME_ROLE:-lockin_app}
    POSTGRES_CONN_MAX_AGE: ${POSTGRES_CONN_MAX_AGE:-60}
    POSTGRES_SSLMODE: ${POSTGRES_SSLMODE:-disable}
    POSTGRES_TRUSTED_PRIVATE_NETWORK: ${POSTGRES_TRUSTED_PRIVATE_NETWORK:-true}
    POSTGRES_STATEMENT_TIMEOUT_MS: ${POSTGRES_STATEMENT_TIMEOUT_MS:-15000}
    POSTGRES_LOCK_TIMEOUT_MS: ${POSTGRES_LOCK_TIMEOUT_MS:-3000}
    POSTGRES_IDLE_TRANSACTION_TIMEOUT_MS: ${POSTGRES_IDLE_TRANSACTION_TIMEOUT_MS:-30000}
    # Provider-neutral object storage. Changing provider is a change of these
    # values only; no image or application code changes.
    STORAGE_BACKEND: ${STORAGE_BACKEND:-s3}
    STORAGE_BUCKET_NAME: ${STORAGE_BUCKET_NAME:-}
    STORAGE_ENDPOINT_URL: ${STORAGE_ENDPOINT_URL:-}
    STORAGE_REGION: ${STORAGE_REGION:-auto}
    STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:-}
    STORAGE_SECRET_ACCESS_KEY_FILE: ${STORAGE_SECRET_ACCESS_KEY_FILE:+/run/secrets/storage_secret_access_key}
    STORAGE_ADDRESSING_STYLE: ${STORAGE_ADDRESSING_STYLE:-virtual}
    STORAGE_LOCATION_PREFIX: ${STORAGE_LOCATION_PREFIX:-}
    STORAGE_ALLOW_INSECURE_ENDPOINT: ${STORAGE_ALLOW_INSECURE_ENDPOINT:-false}
    STORAGE_ALLOW_LOCAL_MEDIA: ${STORAGE_ALLOW_LOCAL_MEDIA:-false}
    CONTENT_MAX_PDF_BYTES: ${CONTENT_MAX_PDF_BYTES:-52428800}
    CONTENT_MAX_AUDIO_BYTES: ${CONTENT_MAX_AUDIO_BYTES:-94371840}
    # Deliberately has no default: whether managed files require clean scan
    # evidence is a decision each deployment has to state. Set it false only
    # while the file-scanning profile is stopped, and true together with it.
    CONTENT_REQUIRE_CLEAN_SCAN: ${CONTENT_REQUIRE_CLEAN_SCAN:?Set CONTENT_REQUIRE_CLEAN_SCAN}
    FILE_SCAN_HOST: ${FILE_SCAN_HOST:-clamav}
    FILE_SCAN_PORT: ${FILE_SCAN_PORT:-3310}
    FILE_SCAN_CONNECT_TIMEOUT_SECONDS: ${FILE_SCAN_CONNECT_TIMEOUT_SECONDS:-5}
    FILE_SCAN_READ_TIMEOUT_SECONDS: ${FILE_SCAN_READ_TIMEOUT_SECONDS:-120}
    FILE_SCAN_MAX_ATTEMPTS: ${FILE_SCAN_MAX_ATTEMPTS:-3}
    FILE_SCAN_RETRY_BASE_SECONDS: ${FILE_SCAN_RETRY_BASE_SECONDS:-30}
    FILE_SCAN_RETRY_MAX_SECONDS: ${FILE_SCAN_RETRY_MAX_SECONDS:-900}
    FILE_SCAN_CLAIM_TIMEOUT_SECONDS: ${FILE_SCAN_CLAIM_TIMEOUT_SECONDS:-300}
    FILE_SCAN_WORKER_INTERVAL_SECONDS: ${FILE_SCAN_WORKER_INTERVAL_SECONDS:-10}
    FILE_SCAN_BATCH_SIZE: ${FILE_SCAN_BATCH_SIZE:-8}
    PAYMENT_PROVIDER: none
    DEFAULT_TRIAL_PLAN_CODE: ${DEFAULT_TRIAL_PLAN_CODE:-lockin_trial}
    PAYMENT_CODE_ENCRYPTION_KEY_FILE: /run/secrets/payment_code_encryption_key
    MANUAL_PAYMENT_RATE_WINDOW_SECONDS: ${MANUAL_PAYMENT_RATE_WINDOW_SECONDS:-3600}
    MANUAL_PAYMENT_RATE_LIMIT: ${MANUAL_PAYMENT_RATE_LIMIT:-5}
    TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    TELEGRAM_PAYMENT_CHAT_ID: ${TELEGRAM_PAYMENT_CHAT_ID:-}
    TELEGRAM_HTTP_TIMEOUT_SECONDS: ${TELEGRAM_HTTP_TIMEOUT_SECONDS:-5}
    SUBSCRIPTION_SCHEDULER_INTERVAL_SECONDS: ${SUBSCRIPTION_SCHEDULER_INTERVAL_SECONDS:-900}
    NOTIFICATION_SCHEDULER_INTERVAL_SECONDS: ${NOTIFICATION_SCHEDULER_INTERVAL_SECONDS:-60}
    OPERATIONAL_CLEANUP_INTERVAL_SECONDS: ${OPERATIONAL_CLEANUP_INTERVAL_SECONDS:-3600}
    OPERATIONAL_DATA_RETENTION_DAYS: ${OPERATIONAL_DATA_RETENTION_DAYS:-30}
    COMMERCE_RECONCILIATION_INTERVAL_SECONDS: ${COMMERCE_RECONCILIATION_INTERVAL_SECONDS:-21600}
    ANALYTICS_REBUILD_INTERVAL_SECONDS: ${ANALYTICS_REBUILD_INTERVAL_SECONDS:-86400}
    MOTIVATION_REBUILD_INTERVAL_SECONDS: ${MOTIVATION_REBUILD_INTERVAL_SECONDS:-86400}
    OPERATIONS_SCHEDULER_POLL_SECONDS: ${OPERATIONS_SCHEDULER_POLL_SECONDS:-15}
    OPERATIONS_JOB_LEASE_SECONDS: ${OPERATIONS_JOB_LEASE_SECONDS:-7200}
    OBSERVABILITY_SLOW_REQUEST_MS: ${OBSERVABILITY_SLOW_REQUEST_MS:-1000}
    GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
    GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
    GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-}
    APPLE_OAUTH_SERVICES_ID: ${APPLE_OAUTH_SERVICES_ID:-}
    APPLE_OAUTH_TEAM_ID: ${APPLE_OAUTH_TEAM_ID:-}
    APPLE_OAUTH_KEY_ID: ${APPLE_OAUTH_KEY_ID:-}
    APPLE_OAUTH_PRIVATE_KEY: ${APPLE_OAUTH_PRIVATE_KEY:-}
    APPLE_OAUTH_REDIRECT_URI: ${APPLE_OAUTH_REDIRECT_URI:-}
    OAUTH_FLOW_TTL_SECONDS: ${OAUTH_FLOW_TTL_SECONDS:-600}
    OAUTH_HTTP_TIMEOUT_SECONDS: ${OAUTH_HTTP_TIMEOUT_SECONDS:-10}
    OBSERVABILITY_STATSD_HOST: ${OBSERVABILITY_STATSD_HOST:?Set OBSERVABILITY_STATSD_HOST}
    OBSERVABILITY_STATSD_PORT: ${OBSERVABILITY_STATSD_PORT:-8125}
    OBSERVABILITY_METRIC_PREFIX: ${OBSERVABILITY_METRIC_PREFIX:-lockin}
    OBSERVABILITY_ERROR_WEBHOOK_URL: ${OBSERVABILITY_ERROR_WEBHOOK_URL:?Set OBSERVABILITY_ERROR_WEBHOOK_URL}
    OBSERVABILITY_ERROR_WEBHOOK_TOKEN_FILE: /run/secrets/observability_error_webhook_token
    OBSERVABILITY_ERROR_TIMEOUT_SECONDS: ${OBSERVABILITY_ERROR_TIMEOUT_SECONDS:-3}
  secrets:
    - django_secret_key
    - email_host_password
    - payment_code_encryption_key
    - observability_error_webhook_token
    - storage_secret_access_key
  networks:
    - application
    - data
  restart: "no"
  read_only: true
  tmpfs:
    - /tmp:size=268435456,mode=1777
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  clamav:
    # Opt-in, and off for the initial launch. Activate with
    # COMPOSE_PROFILES=file-scanning together with CONTENT_REQUIRE_CLEAN_SCAN=true;
    # the scanning architecture is intact and enabling it is configuration only.
    # It needs about 1.6 GB resident and 2.4 GB during the daily signature
    # reload, so it does not fit beside the application on a 4 GB host.
    profiles: ["file-scanning"]
    build:
      context: ./deploy/clamav
    image: ${LOCKIN_IMAGE_REPOSITORY:-lockin}-clamav:${LOCKIN_IMAGE_TAG:?Set LOCKIN_IMAGE_TAG}
    pull_policy: ${LOCKIN_PULL_POLICY:-always}
    logging: *logging
    restart: unless-stopped
    environment:
      CLAMD_STARTUP_TIMEOUT: 1800
      FRESHCLAM_CHECKS: 24
    volumes:
      - lockin_clamav_signatures:/var/lib/clamav
    networks:
      - data
    mem_limit: 4g
    cpus: 2.0
    pids_limit: 256
    security_opt:
      - no-new-privileges:true

  db:
    # Opt-in. Activate with COMPOSE_PROFILES=bundled-db, or leave it out and
    # point POSTGRES_HOST/POSTGRES_PORT at a managed PostgreSQL instance.
    profiles: ["bundled-db"]
    image: postgres:18.4-alpine
    logging: *logging
    # Docker's 64 MB default is too small for PostgreSQL's dynamic shared
    # memory, and parallel query workers fail with "could not resize shared
    # memory segment" when they exhaust it.
    shm_size: 256mb
    mem_limit: 1g
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lockin}
      POSTGRES_USER: ${POSTGRES_OWNER_USER:-lockin_owner}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_owner_password
      POSTGRES_INITDB_ARGS: --data-checksums --auth-host=scram-sha-256
      LOCKIN_RUNTIME_ROLE: ${POSTGRES_RUNTIME_ROLE:-lockin_app}
      LOCKIN_RUNTIME_PASSWORD_FILE: /run/secrets/postgres_runtime_password
    secrets:
      - postgres_owner_password
      - postgres_runtime_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    volumes:
      - lockin_postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/init-runtime-role.sh:/docker-entrypoint-initdb.d/10-lockin-runtime-role.sh:ro
    networks:
      - data
    stop_grace_period: 60s

  release:
    <<: *backend-common
    command: ["python", "manage.py", "release"]
    mem_limit: 768m
    environment:
      <<: *backend-environment
      POSTGRES_USER: ${POSTGRES_OWNER_USER:-lockin_owner}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_owner_password
      POSTGRES_STATEMENT_TIMEOUT_MS: 0
      POSTGRES_LOCK_TIMEOUT_MS: 0
    secrets:
      - django_secret_key
      - email_host_password
      - payment_code_encryption_key
      - observability_error_webhook_token
      - storage_secret_access_key
      - postgres_owner_password
    depends_on:
      db:
        condition: service_healthy
        # Absent when the deployment uses a managed database.
        required: false
    volumes:
      - lockin_static:/app/staticfiles

  preflight:
    <<: *backend-common
    command: ["python", "manage.py", "production_preflight"]
    mem_limit: 512m
    environment:
      <<: *backend-environment
      POSTGRES_USER: ${POSTGRES_RUNTIME_ROLE:-lockin_app}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_runtime_password
    secrets:
      - django_secret_key
      - email_host_password
      - payment_code_encryption_key
      - observability_error_webhook_token
      - storage_secret_access_key
      - postgres_runtime_password
    depends_on:
      release:
        condition: service_completed_successfully
    volumes:
      - lockin_static:/app/staticfiles:ro

  backend:
    <<: *backend-common
    # An explicit ceiling keeps a runaway worker from taking the host down with
    # it. Without limits the kernel picks the OOM victim, and on this host that
    # is as likely to be PostgreSQL as the process at fault.
    mem_limit: 1536m
    restart: unless-stopped
    environment:
      <<: *backend-environment
      POSTGRES_USER: ${POSTGRES_RUNTIME_ROLE:-lockin_app}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_runtime_password
      # Sized for a 2 vCPU / 4 GB host that also runs PostgreSQL. Threads carry
      # the streamed private-file downloads, which hold a thread for the length
      # of the client transfer, so they are deliberately far above the worker
      # count: the work is I/O, not CPU.
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-8}
      GUNICORN_PRELOAD_APP: ${GUNICORN_PRELOAD_APP:-true}
      GUNICORN_TIMEOUT_SECONDS: ${GUNICORN_TIMEOUT_SECONDS:-60}
      GUNICORN_GRACEFUL_TIMEOUT_SECONDS: ${GUNICORN_GRACEFUL_TIMEOUT_SECONDS:-30}
      GUNICORN_KEEPALIVE_SECONDS: ${GUNICORN_KEEPALIVE_SECONDS:-5}
      GUNICORN_MAX_REQUESTS: ${GUNICORN_MAX_REQUESTS:-1000}
      GUNICORN_MAX_REQUESTS_JITTER: ${GUNICORN_MAX_REQUESTS_JITTER:-100}
      GUNICORN_FORWARDED_ALLOW_IPS: "*"
    secrets:
      - django_secret_key
      - email_host_password
      - payment_code_encryption_key
      - observability_error_webhook_token
      - storage_secret_access_key
      - postgres_runtime_password
    depends_on:
      preflight:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import os,urllib.request;
          request=urllib.request.Request('http://127.0.0.1:8000/api/v1/health/ready',headers={'Host':os.environ['DJANGO_ALLOWED_HOSTS'].split(',')[0],'X-Forwarded-Proto':'https'});
          urllib.request.urlopen(request,timeout=3).read()
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s
    volumes:
      - lockin_media:/app/media
    stop_grace_period: 45s

  operations-scheduler:
    <<: *backend-common
    command: ["python", "manage.py", "run_operations_scheduler"]
    mem_limit: 512m
    restart: unless-stopped
    environment:
      <<: *backend-environment
      POSTGRES_USER: ${POSTGRES_RUNTIME_ROLE:-lockin_app}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_runtime_password
    secrets:
      - django_secret_key
      - email_host_password
      - payment_code_encryption_key
      - observability_error_webhook_token
      - storage_secret_access_key
      - postgres_runtime_password
    depends_on:
      preflight:
        condition: service_completed_successfully
    stop_grace_period: 30s

  file-scan-worker:
    # Starts only with the scanner it feeds. See the clamav service above.
    profiles: ["file-scanning"]
    <<: *backend-common
    command: ["python", "manage.py", "run_file_scanner"]
    mem_limit: 512m
    restart: unless-stopped
    environment:
      <<: *backend-environment
      POSTGRES_USER: ${POSTGRES_RUNTIME_ROLE:-lockin_app}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_runtime_password
    secrets:
      - django_secret_key
      - email_host_password
      - payment_code_encryption_key
      - observability_error_webhook_token
      - storage_secret_access_key
      - postgres_runtime_password
    depends_on:
      preflight:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy
    volumes:
      - lockin_media:/app/media
    stop_grace_period: 150s

  edge:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
        VITE_APP_VERSION: ${LOCKIN_IMAGE_TAG:?Set LOCKIN_IMAGE_TAG}
        VITE_SUPPORT_EMAIL: ${LOCKIN_SUPPORT_EMAIL:?Set LOCKIN_SUPPORT_EMAIL}
        VITE_LEGAL_ENTITY: ${LOCKIN_LEGAL_ENTITY:?Set LOCKIN_LEGAL_ENTITY}
        VITE_LEGAL_ADDRESS: ${LOCKIN_LEGAL_ADDRESS:?Set LOCKIN_LEGAL_ADDRESS}
        VITE_LEGAL_JURISDICTION: ${LOCKIN_LEGAL_JURISDICTION:?Set LOCKIN_LEGAL_JURISDICTION}
        VITE_POLICY_VERSION: ${ACCOUNT_POLICY_VERSION:?Set ACCOUNT_POLICY_VERSION}
    image: ${LOCKIN_IMAGE_REPOSITORY:-lockin}-edge:${LOCKIN_IMAGE_TAG:?Set LOCKIN_IMAGE_TAG}
    pull_policy: ${LOCKIN_PULL_POLICY:-always}
    logging: *logging
    mem_limit: 256m
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:8080"
      - "443:8443"
    volumes:
      - lockin_static:/srv/lockin/static:ro
      # Both must be readable by uid 10001, the unprivileged user the image
      # runs as. A root-owned 0600 key cannot be read and the edge will not
      # start; see docs/DEPLOYMENT.md, "Reverse proxy and HTTPS".
      - ${TLS_CERT_PATH:?Set TLS_CERT_PATH}:/run/tls/fullchain.pem:ro
      - ${TLS_KEY_PATH:?Set TLS_KEY_PATH}:/run/tls/privatekey.pem:ro
    networks:
      - application
    # The image runs nginx unprivileged specifically so these three settings can
    # hold together. A root nginx master would chown its temporary-path
    # directories at start-up and fail, because cap_drop removes CAP_CHOWN and
    # the tmpfs below is empty on every boot. scripts/ci/edge-smoke.sh starts the
    # image with exactly these options so the combination stays proven.
    read_only: true
    tmpfs:
      - /tmp:size=67108864,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

secrets:
  django_secret_key:
    file: ${DJANGO_SECRET_KEY_FILE:?Set DJANGO_SECRET_KEY_FILE}
  email_host_password:
    file: ${EMAIL_HOST_PASSWORD_FILE:?Set EMAIL_HOST_PASSWORD_FILE}
  payment_code_encryption_key:
    file: ${PAYMENT_CODE_ENCRYPTION_KEY_FILE:?Set PAYMENT_CODE_ENCRYPTION_KEY_FILE}
  observability_error_webhook_token:
    file: ${OBSERVABILITY_ERROR_WEBHOOK_TOKEN_FILE:?Set OBSERVABILITY_ERROR_WEBHOOK_TOKEN_FILE}
  # Unset resolves to an empty file, and the containers are told to ignore it.
  storage_secret_access_key:
    file: ${STORAGE_SECRET_ACCESS_KEY_FILE:-/dev/null}
  postgres_owner_password:
    file: ${POSTGRES_OWNER_PASSWORD_FILE:?Set POSTGRES_OWNER_PASSWORD_FILE}
  postgres_runtime_password:
    file: ${POSTGRES_RUNTIME_PASSWORD_FILE:?Set POSTGRES_RUNTIME_PASSWORD_FILE}

volumes:
  lockin_postgres_data:
  lockin_clamav_signatures:
  lockin_static:
  lockin_media:

networks:
  application:
    internal: false
    ipam:
      config:
        - subnet: 172.28.0.0/24
  data:
    internal: true
