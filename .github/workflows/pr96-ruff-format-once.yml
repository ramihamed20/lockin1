name: PR96 one-time Ruff formatter

on:
  push:
    branches:
      - feat/ai-sheet-translation-20261109

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned Ruff
        run: python -m pip install ruff==0.15.21
      - name: Format only the translation backend code and tests
        run: |
          ruff format backend/apps/content/sheet_translation_batch.py backend/apps/content/tests/test_sheet_translation_batch.py
          ruff check backend/apps/content/sheet_translation_batch.py backend/apps/content/tests/test_sheet_translation_batch.py
      - name: Commit formatting changes to the same feature branch
        run: |
          git add backend/apps/content/sheet_translation_batch.py backend/apps/content/tests/test_sheet_translation_batch.py
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'style(translations): apply Ruff formatter'
            git push origin "HEAD:refs/heads/feat/ai-sheet-translation-20261109"
          fi
