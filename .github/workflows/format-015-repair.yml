name: Temporary 0.1.5 Ruff format repair
on:
  push:
    branches:
      - codex/lockin0.1.5
    paths:
      - .github/workflows/format-015-repair.yml
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'ramihamed20/lockin1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/lockin0.1.5
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact project formatter
        run: python -m pip install ruff==0.15.21
      - name: Format backend without changing behavior
        run: python -m ruff format backend
      - name: Commit formatting only on the 0.1.5 branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend
          if ! git diff --cached --quiet; then
            git commit -m "style(0.1.5): apply Ruff formatting to backend"
            git push origin HEAD:codex/lockin0.1.5
          fi
