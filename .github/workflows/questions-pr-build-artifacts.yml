name: Repair questions-only PR generated artifacts
on:
  push:
    branches:
      - feat/tripoli-y2-questions-plans-20261120
    paths:
      - .github/workflows/questions-pr-build-artifacts.yml
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24.16.0"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install "ruff==0.15.21"
      - name: Format and validate only the changed Python sources
        shell: bash
        run: |
          set -euo pipefail
          files=(
            backend/apps/content/urls.py
            backend/apps/content/views.py
            backend/apps/entitlements/access_permissions.py
            backend/apps/entitlements/services.py
            backend/apps/entitlements/tests/test_plan_entitlement_coverage.py
            backend/apps/entitlements/tests/test_questions_only_subscription.py
            backend/apps/payments/manual_services.py
            backend/apps/payments/views.py
            backend/apps/product_catalog/selectors.py
            backend/apps/product_catalog/views.py
            backend/apps/subscriptions/serializers.py
          )
          python -m ruff check --fix "${files[@]}"
          python -m ruff format "${files[@]}"
          python -m ruff check "${files[@]}"
          python -m ruff format --check "${files[@]}"
      - name: Regenerate checked public documentation
        run: |
          set -euo pipefail
          node frontend/scripts/build-public-knowledge.mjs
          node frontend/scripts/build-public-knowledge.mjs --check
          git diff --check
      - name: Commit repair to feature branch only
        shell: bash
        run: |
          set -euo pipefail
          git add backend/apps/content/urls.py backend/apps/content/views.py
          git add backend/apps/entitlements/access_permissions.py backend/apps/entitlements/services.py
          git add backend/apps/entitlements/tests/test_plan_entitlement_coverage.py backend/apps/entitlements/tests/test_questions_only_subscription.py
          git add backend/apps/payments/manual_services.py backend/apps/payments/views.py
          git add backend/apps/product_catalog/selectors.py backend/apps/product_catalog/views.py
          git add backend/apps/subscriptions/serializers.py
          git add frontend/public frontend/nginx/default.conf deploy/container-host/nginx.conf.template
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: regenerate public documents and format question subscription sources"
          git push origin HEAD:refs/heads/feat/tripoli-y2-questions-plans-20261120
