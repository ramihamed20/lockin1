name: production-quality-gate

on:
  pull_request:
  push:
    branches: [main, "codex/**"]

permissions:
  contents: read

concurrency:
  group: lockin-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: lockin_test
          POSTGRES_USER: lockin_owner
          POSTGRES_PASSWORD: ci-owner-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lockin_owner -d lockin_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 18
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: ci-only-django-secret-key-not-for-production
      POSTGRES_DB: lockin_test
      POSTGRES_USER: lockin_owner
      POSTGRES_PASSWORD: ci-owner-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.14"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend
        working-directory: backend
        run: python -m pip install -e ".[dev]"
      - name: Static analysis and migration drift
        working-directory: backend
        run: |
          python -m pip_audit . --strict
          python -m ruff check .
          python -m ruff format --check .
          python -m mypy .
          python manage.py makemigrations --check --dry-run
          python manage.py check
      - name: PostgreSQL test suite
        working-directory: backend
        run: python -m pytest
      - name: Create least-privilege runtime role
        run: >-
          docker exec "${{ job.services.postgres.id }}"
          psql --username lockin_owner --dbname lockin_test --set ON_ERROR_STOP=1
          --command "CREATE ROLE lockin_app LOGIN PASSWORD 'ci-runtime-password'
          NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS"
      - name: Production release gate as migration owner
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
          DJANGO_SECRET_KEY: ci-only-production-secret-key-with-more-than-fifty-characters-0001
          DJANGO_ALLOWED_HOSTS: lockin.example.test
          DJANGO_CSRF_TRUSTED_ORIGINS: https://lockin.example.test
          DJANGO_TRUST_PROXY_SSL_HEADER: "true"
          DJANGO_TRUSTED_PROXY_CIDRS: 127.0.0.1/32
          PUBLIC_APP_URL: https://lockin.example.test
          ACCOUNT_POLICY_VERSION: ci-policy-v1
          DJANGO_EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
          DEFAULT_FROM_EMAIL: Lock-in <no-reply@lockin.example.test>
          EMAIL_HOST: smtp.example.test
          EMAIL_HOST_USER: lockin-ci
          EMAIL_HOST_PASSWORD: ci-email-password
          EMAIL_USE_TLS: "true"
          POSTGRES_DB: lockin_test
          POSTGRES_USER: lockin_owner
          POSTGRES_PASSWORD: ci-owner-password
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: 5432
          POSTGRES_RUNTIME_ROLE: lockin_app
          POSTGRES_SSLMODE: disable
          POSTGRES_TRUSTED_PRIVATE_NETWORK: "true"
          POSTGRES_STATEMENT_TIMEOUT_MS: "0"
          POSTGRES_LOCK_TIMEOUT_MS: "0"
          PAYMENT_PROVIDER: none
          PAYMENT_CODE_ENCRYPTION_KEY: ci-only-payment-encryption-key-value-0001
          FILE_SCAN_HOST: 127.0.0.1
          OBSERVABILITY_STATSD_HOST: 127.0.0.1
          OBSERVABILITY_ERROR_WEBHOOK_URL: https://monitoring.example.test/v1/errors
          OBSERVABILITY_ERROR_WEBHOOK_TOKEN: ci-only-observability-token
          # Production refuses a filesystem media backend without an explicit
          # exception, so the gate has to declare the storage contract it is
          # validating. No bucket is contacted: release runs check, migrate and
          # collectstatic, and collectstatic writes through the staticfiles
          # backend, not the default one.
          STORAGE_BACKEND: s3
          STORAGE_BUCKET_NAME: lockin-ci
          STORAGE_ENDPOINT_URL: https://ci.example.test
          STORAGE_REGION: auto
          STORAGE_ACCESS_KEY_ID: ci-only-storage-key
          STORAGE_SECRET_ACCESS_KEY: ci-only-storage-secret
        run: python manage.py release
      - name: Runtime-role PostgreSQL preflight
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
          DJANGO_SECRET_KEY: ci-only-production-secret-key-with-more-than-fifty-characters-0001
          DJANGO_ALLOWED_HOSTS: lockin.example.test
          DJANGO_CSRF_TRUSTED_ORIGINS: https://lockin.example.test
          DJANGO_TRUST_PROXY_SSL_HEADER: "true"
          DJANGO_TRUSTED_PROXY_CIDRS: 127.0.0.1/32
          PUBLIC_APP_URL: https://lockin.example.test
          ACCOUNT_POLICY_VERSION: ci-policy-v1
          DJANGO_EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
          DEFAULT_FROM_EMAIL: Lock-in <no-reply@lockin.example.test>
          EMAIL_HOST: smtp.example.test
          EMAIL_HOST_USER: lockin-ci
          EMAIL_HOST_PASSWORD: ci-email-password
          EMAIL_USE_TLS: "true"
          POSTGRES_DB: lockin_test
          POSTGRES_USER: lockin_app
          POSTGRES_PASSWORD: ci-runtime-password
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: 5432
          POSTGRES_RUNTIME_ROLE: lockin_app
          POSTGRES_SSLMODE: disable
          POSTGRES_TRUSTED_PRIVATE_NETWORK: "true"
          POSTGRES_STATEMENT_TIMEOUT_MS: "15000"
          POSTGRES_LOCK_TIMEOUT_MS: "3000"
          PAYMENT_PROVIDER: none
          PAYMENT_CODE_ENCRYPTION_KEY: ci-only-payment-encryption-key-value-0001
          FILE_SCAN_HOST: 127.0.0.1
          OBSERVABILITY_STATSD_HOST: 127.0.0.1
          OBSERVABILITY_ERROR_WEBHOOK_URL: https://monitoring.example.test/v1/errors
          OBSERVABILITY_ERROR_WEBHOOK_TOKEN: ci-only-observability-token
          CONTENT_REQUIRE_CLEAN_SCAN: "true"
          # As in the release gate above: the storage contract is declared, and
          # preflight reads no object. It runs check --deploy, database
          # evidence, the migration plan and a scan-state count.
          STORAGE_BACKEND: s3
          STORAGE_BUCKET_NAME: lockin-ci
          STORAGE_ENDPOINT_URL: https://ci.example.test
          STORAGE_REGION: auto
          STORAGE_ACCESS_KEY_ID: ci-only-storage-key
          STORAGE_SECRET_ACCESS_KEY: ci-only-storage-secret
        run: |
          # Both enforcement modes must boot and pass preflight. Running
          # without the scan gate is a supported production configuration,
          # so it is gated here rather than discovered on the VPS.
          python manage.py production_preflight
          CONTENT_REQUIRE_CLEAN_SCAN=false python manage.py production_preflight

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24.16.0"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install exact frontend lockfile
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      # Split out of the quality step below because it fails for a reason the
      # others cannot: npm's advisory service being unreachable says nothing
      # about this repository. The script retries only that case and still
      # fails closed, at the same --audit-level=high, on any real finding.
      - name: Production dependency audit
        run: scripts/ci/pnpm-audit.sh
      - name: Frontend quality and production build
        working-directory: frontend
        run: |
          pnpm run lint
          pnpm run typecheck
          pnpm test
          pnpm run build
          pnpm run check:bundle

  browser:
    runs-on: ubuntu-latest
    # Chromium and its system dependencies ship inside this image, so the job
    # downloads neither. `playwright install --with-deps chromium` stalled
    # indefinitely right after its 167 MB download reported 100%, twice in a
    # row, and carried the job to its 30-minute timeout both times -- a step
    # that completes in about three minutes when it is healthy.
    #
    # The tag must track the pinned @playwright/test version exactly: the
    # library refuses browsers it did not expect, and the image is the thing
    # supplying them. Bump both together, never one alone.
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24.16.0"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install exact frontend lockfile
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      # build:e2e is the production build plus the fixture catalogue sheets the
      # reader specs open (frontend/e2e/fixtures/catalog.js). Everything else is
      # identical production code, and the "frontend" job above still builds and
      # budget-checks the real production bundle.
      - name: Production-bundle browser regression
        working-directory: frontend
        run: pnpm run build:e2e && pnpm run test:e2e

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build immutable application images
        run: |
          docker build --tag lockin-backend:ci backend
          docker build \
            --build-arg VITE_APP_VERSION=${{ github.sha }} \
            --build-arg VITE_SUPPORT_EMAIL=support@lockin.example.test \
            --build-arg VITE_LEGAL_ENTITY="Lock-in CI" \
            --build-arg VITE_LEGAL_ADDRESS="CI test address" \
            --build-arg VITE_LEGAL_JURISDICTION="CI test jurisdiction" \
            --build-arg VITE_POLICY_VERSION=ci-policy-v1 \
            --tag lockin-edge:ci frontend
          docker build --tag lockin-clamav:ci deploy/clamav
      - name: Validate Nginx production configuration
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj "/CN=lockin.example.test" \
            -keyout /tmp/lockin-ci.key -out /tmp/lockin-ci.crt
          chmod 644 /tmp/lockin-ci.key /tmp/lockin-ci.crt
          # nginx resolves a literal proxy_pass hostname while it parses the
          # configuration, so "backend" has to resolve for a syntax check to
          # complete. There is no upstream here and none is needed: this step
          # lints the configuration, and edge-runtime is what proves the proxy
          # actually carries a request.
          docker run --rm --entrypoint nginx \
            --add-host backend:127.0.0.1 \
            --volume /tmp/lockin-ci.crt:/run/tls/fullchain.pem:ro \
            --volume /tmp/lockin-ci.key:/run/tls/privatekey.pem:ro \
            lockin-edge:ci -t
      - name: Validate production Compose contract
        env:
          LOCKIN_IMAGE_TAG: ci
          LOCKIN_PUBLIC_HOST: lockin.example.test
          LOCKIN_SUPPORT_EMAIL: support@lockin.example.test
          LOCKIN_LEGAL_ENTITY: Lock-in CI
          LOCKIN_LEGAL_ADDRESS: CI test address
          LOCKIN_LEGAL_JURISDICTION: CI test jurisdiction
          ACCOUNT_POLICY_VERSION: ci-policy-v1
          DJANGO_EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
          DEFAULT_FROM_EMAIL: Lock-in <no-reply@lockin.example.test>
          EMAIL_HOST: smtp.example.test
          EMAIL_HOST_USER: lockin-ci
          DJANGO_SECRET_KEY_FILE: /tmp/lockin-django-secret
          EMAIL_HOST_PASSWORD_FILE: /tmp/lockin-email-secret
          PAYMENT_CODE_ENCRYPTION_KEY_FILE: /tmp/lockin-payment-secret
          OBSERVABILITY_STATSD_HOST: metrics.example.test
          OBSERVABILITY_ERROR_WEBHOOK_URL: https://monitoring.example.test/v1/errors
          OBSERVABILITY_ERROR_WEBHOOK_TOKEN_FILE: /tmp/lockin-observability-secret
          POSTGRES_OWNER_PASSWORD_FILE: /tmp/lockin-owner-secret
          POSTGRES_RUNTIME_PASSWORD_FILE: /tmp/lockin-runtime-secret
          TLS_CERT_PATH: /tmp/lockin-ci.crt
          TLS_KEY_PATH: /tmp/lockin-ci.key
          CONTENT_REQUIRE_CLEAN_SCAN: "false"
        run: |
          # Both database shapes must stay valid: the bundled container and a
          # managed provider reached over POSTGRES_HOST.
          docker compose -f compose.production.yaml --profile bundled-db config --quiet
          docker compose -f compose.production.yaml config --quiet
          # The launch shape starts no scanner, so the default profile set
          # must not carry one; the opt-in profile must still resolve it.
          if docker compose -f compose.production.yaml config --services | grep -qx clamav; then
            echo "clamav must stay behind the file-scanning profile" >&2
            exit 1
          fi
          docker compose -f compose.production.yaml --profile file-scanning config --services | grep -qx clamav

  container-runtime:
    # Building an image proves nothing about whether it runs. This job is the
    # gate that makes "production-ready" mean the container has actually
    # started, dropped privileges, passed preflight and served a request.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build the production image
        run: docker build --tag lockin-app:ci .
      - name: Start the image and assert the production start-up contract
        run: scripts/ci/docker-smoke.sh lockin-app:ci

  edge-runtime:
    # The Compose edge runs read-only, with every capability dropped, and with
    # one tmpfs for writes. Neither "docker build" nor "nginx -t" exercises any
    # of that, and the failure mode it hides is a container that never binds a
    # port on first boot. This job starts the real image with those exact
    # settings and asserts it serves.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the edge image
        run: |
          docker build \
            --build-arg VITE_APP_VERSION=${{ github.sha }} \
            --build-arg VITE_SUPPORT_EMAIL=support@lockin.example.test \
            --build-arg VITE_LEGAL_ENTITY="Lock-in CI" \
            --build-arg VITE_LEGAL_ADDRESS="CI test address" \
            --build-arg VITE_LEGAL_JURISDICTION="CI test jurisdiction" \
            --build-arg VITE_POLICY_VERSION=ci-policy-v1 \
            --tag lockin-edge:ci frontend
      - name: Start the edge under the production security settings
        run: scripts/ci/edge-smoke.sh lockin-edge:ci

  image-layers:
    # A release that changes only application code must reuse every dependency
    # layer, so a host already running the previous release downloads the
    # application and nothing else. That property lives entirely in the order
    # of steps in the Dockerfiles, so the rebuild matrix runs only when
    # something that defines the images changed; otherwise it was proven when
    # they last did.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # One-off evidence runs set a git ref here to also measure and compare
      # against that ref's Dockerfiles. Empty in normal operation.
      LAYER_REFERENCE: "811919a1864d1561930598f00dc66ccea2549c43"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decide whether the image definitions changed
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -eu
          if [ -n "$LAYER_REFERENCE" ] || [ -z "$BASE_SHA" ] \
            || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE_SHA" HEAD \
            | grep -qE '^(backend/Dockerfile|frontend/Dockerfile|backend/\.dockerignore|frontend/\.dockerignore|\.github/workflows/ci\.yml|scripts/ci/image_layer_stability\.py)$'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Image definitions are unchanged since ${BASE_SHA}."
          fi
      - name: Prove source-only releases reuse dependency layers
        if: steps.scope.outputs.run == 'true'
        run: python3 scripts/ci/image_layer_stability.py ${LAYER_REFERENCE:+--reference "$LAYER_REFERENCE"}

  publish-dry-run:
    # TEMPORARY evidence job, removed before merge: runs the publish job's exact
    # build configuration (buildx, amd64, no attestations, registry cache read)
    # without pushing anything.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      REPOSITORY: ghcr.io/${{ github.repository_owner }}/lockin
      DOCKER_BUILD_RECORD_UPLOAD: false
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/amd64
          provenance: false
          sbom: false
          load: true
          tags: dry-run/lockin-backend:ci
          cache-from: type=registry,ref=${{ env.REPOSITORY }}-backend:buildcache
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          platforms: linux/amd64
          provenance: false
          sbom: false
          load: true
          tags: dry-run/lockin-edge:ci
          build-args: |
            VITE_APP_VERSION=${{ github.sha }}
            VITE_SUPPORT_EMAIL=support@lockin.example.test
            VITE_LEGAL_ENTITY=Lock-in CI
            VITE_LEGAL_ADDRESS=CI test address
            VITE_LEGAL_JURISDICTION=CI test jurisdiction
            VITE_POLICY_VERSION=ci-policy-v1
          cache-from: type=registry,ref=${{ env.REPOSITORY }}-edge:buildcache
      - uses: docker/build-push-action@v6
        with:
          context: deploy/clamav
          platforms: linux/amd64
          provenance: false
          sbom: false
          load: true
          tags: dry-run/lockin-clamav:ci
          cache-from: type=registry,ref=${{ env.REPOSITORY }}-clamav:buildcache
      - name: Report the dry-run images
        run: |
          set -eu
          for image in backend edge clamav; do
            ref="dry-run/lockin-${image}:ci"
            facts="$(docker image inspect --format '{{.Os}}/{{.Architecture}} layers={{len .RootFS.Layers}} size={{.Size}} user={{.Config.User}} cmd={{json .Config.Cmd}}' "$ref")"
            echo "::notice title=dry-run ${image}::${facts}"
          done
          scripts/ci/edge-smoke.sh dry-run/lockin-edge:ci

  publish:
    # Production images are built and published here, never on the
    # deployment host. A frontend build peaks near 2 GB, which a 4 GB
    # application VPS cannot spare beside PostgreSQL and a running
    # application, and building on the host also makes the deployed
    # artefact unreproducible.
    #
    # The legal and support values are public build inputs, not secrets.
    # Set them as repository variables before the first publish; the
    # frontend image refuses to build on placeholders.
    #
    # Layer reuse across releases comes from a BuildKit cache kept in GHCR
    # beside each image, under the `buildcache` tag. A registry cache rather
    # than the GitHub Actions cache: Actions evicts entries unused for 7 days,
    # and an evicted cache rebuilds every layer under new digests, which puts
    # the whole image back on the host's next pull. Only this job, on main and
    # after every gate has passed, writes it; pull requests never do. The
    # `buildcache` tags are build metadata, not runnable images: never deploy
    # them.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend, browser, containers, container-runtime, edge-runtime, image-layers]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      REPOSITORY: ghcr.io/${{ github.repository_owner }}/lockin
      # The published image and this log are the release record; a separate
      # build-record artifact would only duplicate them.
      DOCKER_BUILD_RECORD_UPLOAD: false
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Sign in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # amd64 only, as production is, and no provenance or SBOM attestations:
      # each tag stays the single Docker image manifest it has always been.
      - name: Build and push the backend image
        id: backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/amd64
          provenance: false
          sbom: false
          push: true
          tags: ${{ env.REPOSITORY }}-backend:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.REPOSITORY }}-backend:buildcache
          cache-to: type=registry,ref=${{ env.REPOSITORY }}-backend:buildcache,mode=max,image-manifest=true,oci-mediatypes=true
      - name: Build and push the edge image
        id: edge
        uses: docker/build-push-action@v6
        with:
          context: frontend
          platforms: linux/amd64
          provenance: false
          sbom: false
          push: true
          tags: ${{ env.REPOSITORY }}-edge:${{ github.sha }}
          build-args: |
            VITE_APP_VERSION=${{ github.sha }}
            VITE_SUPPORT_EMAIL=${{ vars.LOCKIN_SUPPORT_EMAIL }}
            VITE_LEGAL_ENTITY=${{ vars.LOCKIN_LEGAL_ENTITY }}
            VITE_LEGAL_ADDRESS=${{ vars.LOCKIN_LEGAL_ADDRESS }}
            VITE_LEGAL_JURISDICTION=${{ vars.LOCKIN_LEGAL_JURISDICTION }}
            VITE_POLICY_VERSION=${{ vars.ACCOUNT_POLICY_VERSION }}
          cache-from: type=registry,ref=${{ env.REPOSITORY }}-edge:buildcache
          cache-to: type=registry,ref=${{ env.REPOSITORY }}-edge:buildcache,mode=max,image-manifest=true,oci-mediatypes=true
      # The scanner image is published with every release so that enabling the
      # file-scanning profile stays a configuration change.
      - name: Build and push the scanner image
        id: clamav
        uses: docker/build-push-action@v6
        with:
          context: deploy/clamav
          platforms: linux/amd64
          provenance: false
          sbom: false
          push: true
          tags: ${{ env.REPOSITORY }}-clamav:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.REPOSITORY }}-clamav:buildcache
          cache-to: type=registry,ref=${{ env.REPOSITORY }}-clamav:buildcache,mode=max,image-manifest=true,oci-mediatypes=true
      - name: Verify the published release
        # Reads the release back from the registry: every tag must resolve to
        # exactly the digest this job pushed, as one linux/amd64 manifest. Sizes
        # are reported, and only a large regression raises a warning.
        env:
          TAG: ${{ github.sha }}
          PREVIOUS_TAG: ${{ github.event.before }}
          BACKEND_DIGEST: ${{ steps.backend.outputs.digest }}
          EDGE_DIGEST: ${{ steps.edge.outputs.digest }}
          CLAMAV_DIGEST: ${{ steps.clamav.outputs.digest }}
        run: |
          set -eu
          megabytes() { awk -v bytes="$1" 'BEGIN { printf "%.1f MB", bytes / 1048576 }'; }
          {
            echo "### Published release ${TAG}"
            echo
            echo "| image | digest | layers | compressed | new since the previous release |"
            echo "|---|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          verify() {
            name="$1" expected="$2" review_mb="$3"
            ref="${REPOSITORY}-${name}:${TAG}"
            raw="$(docker buildx imagetools inspect --raw "$ref")"
            media="$(printf '%s' "$raw" | jq -r '.mediaType')"
            case "$media" in
              application/vnd.docker.distribution.manifest.v2+json|application/vnd.oci.image.manifest.v1+json) ;;
              *) echo "::error title=Publish::${ref} is ${media}, not a single image manifest"; return 1 ;;
            esac
            digest="$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' | jq -r '.digest')"
            if [ "$digest" != "$expected" ]; then
              echo "::error title=Publish::${ref} resolves to ${digest}; this job pushed ${expected}"
              return 1
            fi
            platform="$(docker buildx imagetools inspect "$ref" --format '{{json .Image}}' | jq -r '.os + "/" + .architecture')"
            if [ "$platform" != linux/amd64 ]; then
              echo "::error title=Publish::${ref} is ${platform}, production runs linux/amd64"
              return 1
            fi
            layers="$(printf '%s' "$raw" | jq '.layers | length')"
            bytes="$(printf '%s' "$raw" | jq '[.layers[].size] | add')"
            fresh="no previous release to compare"
            if [ -n "$PREVIOUS_TAG" ] \
              && previous="$(docker buildx imagetools inspect --raw "${REPOSITORY}-${name}:${PREVIOUS_TAG}" 2>/dev/null)"; then
              fresh_bytes="$(jq -n --argjson new "$raw" --argjson old "$previous" \
                '[$old.layers[].digest] as $held | [$new.layers[] | select(.digest as $d | $held | index($d) | not) | .size] | add // 0')"
              fresh="$(megabytes "$fresh_bytes")"
            fi
            echo "| ${name} | \`${digest}\` | ${layers} | $(megabytes "$bytes") | ${fresh} |" >> "$GITHUB_STEP_SUMMARY"
            echo "::notice title=${name}::${ref} ${digest}, ${layers} layers, $(megabytes "$bytes") compressed, new since previous release: ${fresh}"
            if [ "$bytes" -gt $(( review_mb * 1048576 )) ]; then
              echo "::warning title=Image size::${name} is $(megabytes "$bytes") compressed, above the ${review_mb} MB review threshold"
            fi
          }
          verify backend "$BACKEND_DIGEST" 200
          verify edge "$EDGE_DIGEST" 100
          verify clamav "$CLAMAV_DIGEST" 200
          echo "Deploy with LOCKIN_IMAGE_REPOSITORY=${REPOSITORY} LOCKIN_IMAGE_TAG=${TAG}"

  quality-gate:
    if: always()
    needs: [backend, frontend, browser, containers, container-runtime, edge-runtime, image-layers]
    runs-on: ubuntu-latest
    steps:
      - name: Require every production gate
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          CONTAINER_RESULT: ${{ needs.containers.result }}
          CONTAINER_RUNTIME_RESULT: ${{ needs['container-runtime'].result }}
          EDGE_RUNTIME_RESULT: ${{ needs['edge-runtime'].result }}
          IMAGE_LAYERS_RESULT: ${{ needs['image-layers'].result }}
        run: |
          test "$BACKEND_RESULT" = success
          test "$FRONTEND_RESULT" = success
          test "$BROWSER_RESULT" = success
          test "$CONTAINER_RESULT" = success
          # A deployment is not production-ready until the image has started in CI.
          test "$CONTAINER_RUNTIME_RESULT" = success
          # ... and not until the edge has started under the security settings
          # production actually applies to it.
          test "$EDGE_RUNTIME_RESULT" = success
          # A source-only release must keep reusing the dependency layers.
          test "$IMAGE_LAYERS_RESULT" = success
