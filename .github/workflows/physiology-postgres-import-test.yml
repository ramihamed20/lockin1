name: Physiology All-Questions PostgreSQL Import Verification

on:
  push:
    branches: [feat/physiology-questions-tooling]
    paths:
      - scripts/physiology_questions/**
      - .github/workflows/physiology-postgres-import-test.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: physiology-pg-import-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-postgres-import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: lockin_test
          POSTGRES_USER: lockin_owner
          POSTGRES_PASSWORD: ci-owner-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lockin_owner -d lockin_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 18
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: ci-only-django-secret-key-not-for-production
      POSTGRES_DB: lockin_test
      POSTGRES_USER: lockin_owner
      POSTGRES_PASSWORD: ci-owner-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.14"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend
        working-directory: backend
        run: python -m pip install -e ".[dev]"
      - name: Disable durability on throwaway CI PostgreSQL
        run: >-
          docker exec "${{ job.services.postgres.id }}"
          psql --username lockin_owner --dbname lockin_test --set ON_ERROR_STOP=1
          --command "ALTER SYSTEM SET fsync = off"
          --command "ALTER SYSTEM SET synchronous_commit = off"
          --command "ALTER SYSTEM SET full_page_writes = off"
          --command "SELECT pg_reload_conf()"
      - name: Strict-style JSON validation (all 4 Physiology sheets)
        run: |
          python scripts/physiology_questions/validate_physiology_questions.py --total-pages 8 --excl-start 1 --excl-end 1 --mode pages --normal-count 30 --strict-style scripts/physiology_questions/outputs/01_the_cell_35923940_all_questions.json
          python scripts/physiology_questions/validate_physiology_questions.py --total-pages 5 --excl-start 1 --excl-end 1 --mode pages --normal-count 30 --strict-style scripts/physiology_questions/outputs/02_cell_junction_4e76d4c0_all_questions.json
          python scripts/physiology_questions/validate_physiology_questions.py --total-pages 7 --excl-start 1 --excl-end 1 --mode pages --normal-count 30 --strict-style scripts/physiology_questions/outputs/03_cell_membrane_bde95a78_all_questions.json
          python scripts/physiology_questions/validate_physiology_questions.py --total-pages 6 --excl-start 1 --excl-end 1 --mode pages --normal-count 30 --strict-style scripts/physiology_questions/outputs/04_homeostasis_2855f5b0_all_questions.json
      - name: Physiology tooling pytest suite
        working-directory: backend
        run: python -m pytest -v ../scripts/physiology_questions/test_physiology_tooling.py
      - name: Import all 4 Physiology JSON payloads into isolated PostgreSQL
        run: python scripts/physiology_questions/verify_postgres_import.py
      - name: Backend All-Questions & Active-Study PostgreSQL tests
        working-directory: backend
        run: >-
          python -m pytest -q --no-cov
          apps/content/tests/test_all_questions_file_import.py
          apps/content/tests/test_all_questions.py
          apps/content/tests/test_active_study_question_content.py
