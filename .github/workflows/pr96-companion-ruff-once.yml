name: PR96 one-time companion Python Ruff format

on:
  push:
    branches:
      - feat/ai-sheet-translation-20261109

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install same Ruff version used by backend CI
        run: python -m pip install ruff==0.15.21
      - name: Format companion generator, management command and tests
        run: |
          ruff format backend/apps/content/companion_antigravity.py backend/apps/content/management/commands/generate_companion_cards.py backend/apps/content/tests/test_companion_antigravity.py
          ruff check backend/apps/content/companion_antigravity.py backend/apps/content/management/commands/generate_companion_cards.py backend/apps/content/tests/test_companion_antigravity.py
      - name: Commit formatted code to this branch only
        run: |
          git add backend/apps/content/companion_antigravity.py backend/apps/content/management/commands/generate_companion_cards.py backend/apps/content/tests/test_companion_antigravity.py
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'style(companion): apply Ruff formatter to Antigravity generator'
            git push origin "HEAD:refs/heads/feat/ai-sheet-translation-20261109"
          fi
