name: Regenerate reviewed public pages for unified release

on:
  push:
    branches:
      - release/lockin-unified-2026-11-08
    paths:
      - .github/workflows/unified-public-regeneration.yml

permissions:
  contents: write

jobs:
  sync-public-generated-files:
    if: github.repository == 'ramihamed20/lockin1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/lockin-unified-2026-11-08
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
      - name: Verify source evidence and regenerate using the canonical script
        run: |
          node frontend/scripts/build-public-knowledge.mjs
          node frontend/scripts/build-public-knowledge.mjs --check
      - name: Commit only canonical generated website and Nginx outputs
        run: |
          git add frontend/public frontend/nginx/default.conf deploy/container-host/nginx.conf.template
          if git diff --cached --quiet; then
            echo 'Public generated pages already match the source.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(public): regenerate reviewed release pages and route allowlist'
          git push origin HEAD:refs/heads/release/lockin-unified-2026-11-08
