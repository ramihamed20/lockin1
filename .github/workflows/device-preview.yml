name: Device preview screenshots (0.1.4+)
on:
  pull_request:
    paths:
      - ".github/workflows/device-preview.yml"
permissions:
  contents: read
jobs:
  capture:
    name: Preview ${{ matrix.label }}
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: settings
            ref: codex/settings-apple-redesign
            spec: e2e/settings-redesign.spec.js
            grep: "search and section navigation are usable at this size"
          - label: rank
            ref: codex/rank-mode-rebuild
            spec: e2e/rank-mode.spec.js
            grep: "rank mode renders and changes periods at (390px|820px|1180px)"
          - label: lockin
            ref: codex/lockin-mode-launch
            spec: e2e/lock-in-live.spec.js
            grep: "Live session fits (ipad|phone)|Arabic live timer"
          - label: study-plan
            ref: codex/lockin0.1.5
            spec: e2e/study-plan-adaptive.spec.js
            grep: "study-plan visual preview"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24.16.0"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Build real client with e2e API fixtures
        working-directory: frontend
        run: pnpm run build:e2e
      - name: Exercise real UI in Chromium at device sizes
        working-directory: frontend
        run: pnpm exec playwright test "${{ matrix.spec }}" --grep "${{ matrix.grep }}" --workers=1
      - name: Collect snapshots even when an assertion fails
        if: always()
        run: |
          echo "Screenshot PNGs:"
          find frontend/test-results frontend/output -type f -name '*.png' -print 2>/dev/null || true
      - name: Upload actual device screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-preview-${{ matrix.label }}
          path: |
            frontend/test-results/**/*.png
            frontend/output/playwright/*.png
          if-no-files-found: warn
          retention-days: 7
      - name: Expose selected PNG previews
        if: always()
        run: |
          find frontend/test-results frontend/output -type f -name '*.png' \( -iname '*phone*settings*' -o -iname '*ipad-ar-settings*' -o -iname '*rank-mode-390*' -o -iname '*rank-mode-820*' -o -iname '*lockin-live-phone*' -o -iname '*lockin-live-ipad*' -o -iname '*study-plan-visual*' \) 2>/dev/null | sort | head -n 3 | while read -r file; do
            echo "PREVIEW_IMAGE_BEGIN:${file}"
            base64 -w76 "$file"
            echo "PREVIEW_IMAGE_END"
          done
