name: Staging images (no production deployment)
on:
  push:
    branches: ["staging/**"]
permissions:
  contents: read
concurrency:
  group: lockin-staging-images-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      REPOSITORY: ghcr.io/${{ github.repository_owner }}/lockin
      OFFLINE_PUBLIC_KEY: ${{ vars.LOCKIN_STAGING_OFFLINE_LEASE_PUBLIC_KEY }}
      DOCKER_BUILD_RECORD_UPLOAD: false
    steps:
      - uses: actions/checkout@v4
      - name: Require the staging public key
        run: |
          python3 - <<'PY'
          import os, base64
          value = os.environ['OFFLINE_PUBLIC_KEY']
          assert len(base64.b64decode(value, validate=True)) == 32, 'Set LOCKIN_STAGING_OFFLINE_LEASE_PUBLIC_KEY from scripts/staging/prepare.py first'
          PY
      - name: Staging guard tests
        run: python3 -m unittest discover -s scripts/staging -p 'test_*.py'
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          platforms: linux/amd64
          provenance: false
          sbom: false
          tags: ${{ env.REPOSITORY }}-backend:staging-${{ github.sha }}
          cache-from: type=registry,ref=${{ env.REPOSITORY }}-backend:buildcache
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          labels: io.lockin.staging.offline-public-key=${{ env.OFFLINE_PUBLIC_KEY }}
          push: true
          platforms: linux/amd64
          provenance: false
          sbom: false
          tags: ${{ env.REPOSITORY }}-edge:staging-${{ github.sha }}
          cache-from: type=registry,ref=${{ env.REPOSITORY }}-edge:buildcache
          build-args: |
            VITE_APP_VERSION=staging-${{ github.sha }}
            VITE_API_BASE_URL=/api/v1
            VITE_SUPPORT_EMAIL=preview@staging.lockin.ly
            VITE_LEGAL_ENTITY=Lock-in Staging
            VITE_LEGAL_JURISDICTION=Libya
            VITE_POLICY_VERSION=2026.10
            VITE_OFFLINE_LEASE_PUBLIC_KEY=${{ env.OFFLINE_PUBLIC_KEY }}
      - name: Release record
        run: |
          printf 'Staging image tag: staging-%s\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          printf 'No server was deployed. Main and production tags are unchanged.\n' >> "$GITHUB_STEP_SUMMARY"
