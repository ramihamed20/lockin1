name: public-search-diagnostic

on:
  pull_request:
    paths:
      - "frontend/public/**"
      - "frontend/nginx/**"
      - "deploy/container-host/nginx.conf.template"
      - "scripts/ci/inspect-public-search.mjs"
      - ".github/workflows/public-search-diagnostic.yml"

permissions:
  contents: read

jobs:
  public-read:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.16.0"
      - name: Read public DNS and unauthenticated HTTP only
        run: node scripts/ci/inspect-public-search.mjs
