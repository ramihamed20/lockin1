# Use only with compose.production.yaml through scripts/staging/control.sh.
# Compose >= 2.24.4 is needed for !override / !reset.
services:
  db:
    mem_limit: 512m
    shm_size: 128mb
  release:
    mem_limit: 512m
  preflight:
    mem_limit: 384m
  backend:
    mem_limit: 768m
  edge:
    # Cloudflare Tunnel is the only ingress. No host port competes with production.
    ports: !reset []
    mem_limit: 128m
    volumes:
      - ./deploy/staging/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/staging/real-ip.conf:/etc/nginx/conf.d/00-cloudflare-real-ip.conf:ro
      - ./.runtime/staging/htpasswd:/run/staging/htpasswd:ro
      - ./deploy/staging/badge.css:/usr/share/nginx/html/__staging.css:ro
  operations-scheduler:
    profiles: [staging-workers]
  mailpit:
    image: axllent/mailpit:v1.31.1
    restart: unless-stopped
    mem_limit: 128m
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
      MP_WEBROOT: /__mail/
      MP_ALLOWED_HOSTS: staging.lockin.ly
      MP_MAX_MESSAGES: "200"
    networks: [application]
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: "2"}
  tunnel:
    image: cloudflare/cloudflared:2026.10.0
    profiles: [staging-tunnel]
    # Read the token from a file, never a command-line argument.
    command: [tunnel, --no-autoupdate, run, --token-file, /run/secrets/tunnel_token]
    user: "10001:10001"
    secrets: [tunnel_token]
    restart: unless-stopped
    mem_limit: 128m
    depends_on:
      edge: {condition: service_started}
    networks: [application]
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: "2"}
secrets:
  tunnel_token:
    file: ./.runtime/staging/tunnel_token
networks:
  application:
    ipam: !override
      config:
        - subnet: 172.30.88.0/24
