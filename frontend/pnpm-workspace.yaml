allowBuilds:
  esbuild: true

# Keep the build toolchain on compatible versions with published security fixes.
# These bounds cover the vulnerable transitive branches as well as direct PostCSS.
overrides:
  'brace-expansion@1': 1.1.21
  'brace-expansion@2': 2.1.7
  'brace-expansion@5': 5.0.12
  'postcss@8': 8.5.28
  'fast-uri@3': 3.1.8
  'js-yaml@4': 4.3.2
  'nanoid@3': 3.3.18
  'browserslist@4': 4.28.7
  'baseline-browser-mapping@2': 2.11.0
