server {
    listen 8080;
    server_name _;

    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"alive"}';
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 8443 ssl;
    server_name _;

    ssl_certificate /run/tls/fullchain.pem;
    ssl_certificate_key /run/tls/privatekey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /usr/share/nginx/html;
    index index.html;
    # The production application accepts audio files up to 90 MiB. Leave
    # multipart overhead below Cloudflare Free's request-size ceiling.
    client_max_body_size 92m;

    # React uses constrained style attributes for dynamic progress, annotation,
    # and drag geometry. Keep script and stylesheet execution strict while
    # allowing only style attributes, not inline <style> elements.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self'; form-action 'self'; frame-ancestors 'none'; frame-src 'self' https://www.youtube-nocookie.com; img-src 'self' blob: https://i.ytimg.com; manifest-src 'self'; media-src 'self' blob:; object-src 'none'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; style-src-elem 'self'; worker-src 'self' blob:" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
    add_header Referrer-Policy "no-referrer" always;
    set $lockin_robots "noindex, nofollow, noarchive";
    add_header X-Robots-Tag $lockin_robots always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    # One year. An hour was too short to be worth much: a browser that had not
    # visited within the hour was unprotected again, which is most first visits
    # of a day. Keep this in step with DJANGO_SECURE_HSTS_SECONDS -- Django emits
    # its own header on /api/ responses, and two different max-age values on one
    # origin is a contradiction that is hard to notice and hard to debug.
    #
    # Do not include subdomains until an operator has inventoried every host
    # under the parent domain. preload stays off deliberately: it is
    # effectively irreversible.
    add_header Strict-Transport-Security "max-age=31536000" always;

    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"alive"}';
    }

    # Streamed private files, bounded per client. See the zone definitions in
    # nginx.conf for why this route is the one that needs it.
    #
    # burst=60 nodelay absorbs the opening flurry of Range requests pdf.js makes
    # when it loads a document, so a normal reader never sees a 429. The
    # connection cap is what actually protects the thread pool: it bounds how
    # many transfers one client can hold open at once, which is the shape of the
    # problem -- 12 leaves room for several documents and a download in parallel.
    location /api/v1/files/ {
        limit_req zone=lockin_files burst=60 nodelay;
        limit_conn lockin_file_conns 12;

        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        # Ranges and streaming are preserved exactly as below: buffering here
        # would defeat both.
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        # cloudflare-real-ip.conf resolves only allowlisted Cloudflare peers.
        # Forward the resolved address, not a caller-controlled chain.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        # Private files are streamed by the API, and responses reach 50 MB for a
        # PDF and 90 MB for audio. Buffering would spool a whole response into
        # proxy_temp_path, which is the container's small in-memory /tmp, so a
        # slow client would consume host memory and could exhaust it outright.
        # Streaming instead keeps memory bounded and preserves byte ranges for
        # progressive PDF rendering. It holds a Gunicorn thread for the length
        # of the transfer, which is why GUNICORN_THREADS is sized for streams.
        proxy_buffering off;
        # A large download must not be cut off by the default 60s proxy read
        # timeout while the client is still consuming it.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Operators use the capability-gated React operations console. Django's
    # built-in admin is intentionally not exposed at the public edge.
    location ^~ /admin/ {
        return 404;
    }

    location /static/ {
        alias /srv/lockin/static/;
        access_log off;
        expires 1h;
    }

    # pdf.js loads its Vite-emitted worker as an ES module. Match it separately
    # so .mjs is explicit without replacing the normal MIME map for every
    # other hashed asset in this directory.
    location ~ ^/assets/.*\.mjs$ {
        default_type application/javascript;
        access_log off;
        # Public hashed assets only; private API streams keep their byte ranges.
        gzip on;
        gzip_types text/css application/javascript image/svg+xml;
        gzip_min_length 1024;
        gzip_comp_level 5;
        gzip_vary on;
        gzip_proxied any;
        expires max;
        try_files $uri =404;
    }

    location /assets/ {
        access_log off;
        # Public hashed assets only; private API streams keep their byte ranges.
        gzip on;
        gzip_types text/css application/javascript image/svg+xml;
        gzip_min_length 1024;
        gzip_comp_level 5;
        gzip_vary on;
        gzip_proxied any;
        expires max;
        try_files $uri =404;
    }

    location = /service-worker.js {
        expires epoch;
        add_header Service-Worker-Allowed "/" always;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        expires -1;
        try_files $uri =404;
    }

    # BEGIN GENERATED PUBLIC KNOWLEDGE
    # Exact published routes only; no prefix grant to private/help/API paths.
    location ~ ^/(about|medicine|dentistry|features|features/notes|features/active-study|features/review|features/questions|help|help/topics/getting-started|help/topics/studying|help/topics/review-progress|help/topics/account-security|help/topics/troubleshooting|help/what-is-lockin|help/who-is-lockin-for|help/supported-universities|help/need-account|help/open-materials|help/cohort-content|help/sheet-editions|help/about-settings|help/open-pdf|help/pdf-notes|help/pen-tool|help/highlight-tool|help/erase-marks|help/text-notes|help/notes-private|help/pdf-original|help/active-study-what|help/start-active-study|help/active-availability|help/active-difficulty|help/active-parts|help/active-final|help/active-resume|help/active-restart|help/normal-or-active|help/question-sources|help/practical-questions|help/mixed-questions|help/question-explanations|help/find-mistakes|help/saved-mistakes|help/repeat-mistake|help/mastered-question|help/empty-review|help/weekly-recall|help/weekly-not-ready|help/start-weekly|help/weekly-errors|help/progress-page|help/periodic-reports|help/private-and-public|help/account-security|help/supported-access|help/missing-materials|help/missing-questions|help/reader-unavailable|help/notes-not-synced|help/active-start-error|help/contact-support)/$ {
        set $lockin_robots "index, follow, max-image-preview:large";
        try_files ${uri}index.html =404;
    }
    location ~ ^/(about|medicine|dentistry|features|features/notes|features/active-study|features/review|features/questions|help|help/topics/getting-started|help/topics/studying|help/topics/review-progress|help/topics/account-security|help/topics/troubleshooting|help/what-is-lockin|help/who-is-lockin-for|help/supported-universities|help/need-account|help/open-materials|help/cohort-content|help/sheet-editions|help/about-settings|help/open-pdf|help/pdf-notes|help/pen-tool|help/highlight-tool|help/erase-marks|help/text-notes|help/notes-private|help/pdf-original|help/active-study-what|help/start-active-study|help/active-availability|help/active-difficulty|help/active-parts|help/active-final|help/active-resume|help/active-restart|help/normal-or-active|help/question-sources|help/practical-questions|help/mixed-questions|help/question-explanations|help/find-mistakes|help/saved-mistakes|help/repeat-mistake|help/mastered-question|help/empty-review|help/weekly-recall|help/weekly-not-ready|help/start-weekly|help/weekly-errors|help/progress-page|help/periodic-reports|help/private-and-public|help/account-security|help/supported-access|help/missing-materials|help/missing-questions|help/reader-unavailable|help/notes-not-synced|help/active-start-error|help/contact-support)(?:/index\.html)?$ {
        return 308 /$1/;
    }
    location = /llms.txt {
        default_type text/plain;
        try_files $uri =404;
    }
    # END GENERATED PUBLIC KNOWLEDGE

    location = /sitemap.xml {
        types { application/xml xml; }
        default_type application/xml;
        expires -1;
        try_files $uri =404;
    }

    location = /robots.txt {
        expires -1;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}
