server {
    listen 8080;
    server_name _;

    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"alive"}';
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 8443 ssl;
    server_name _;

    ssl_certificate /run/tls/fullchain.pem;
    ssl_certificate_key /run/tls/privatekey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /usr/share/nginx/html;
    index index.html;
    # The production application accepts audio files up to 90 MiB. Leave
    # multipart overhead below Cloudflare Free's request-size ceiling.
    client_max_body_size 92m;

    # React uses constrained style attributes for dynamic progress, annotation,
    # and drag geometry. Keep script and stylesheet execution strict while
    # allowing only style attributes, not inline <style> elements.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self'; form-action 'self'; frame-ancestors 'none'; frame-src 'self'; img-src 'self' blob:; manifest-src 'self'; media-src 'self' blob:; object-src 'none'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; style-src-elem 'self'; worker-src 'self' blob:" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=3600; includeSubDomains" always;

    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"alive"}';
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        # cloudflare-real-ip.conf resolves only allowlisted Cloudflare peers.
        # Forward the resolved address, not a caller-controlled chain.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_request_buffering off;
    }

    # Operators use the capability-gated React operations console. Django's
    # built-in admin is intentionally not exposed at the public edge.
    location ^~ /admin/ {
        return 404;
    }

    location /static/ {
        alias /srv/lockin/static/;
        access_log off;
        expires 1h;
    }

    location /assets/ {
        access_log off;
        expires max;
        try_files $uri =404;
    }

    location = /service-worker.js {
        expires epoch;
        add_header Service-Worker-Allowed "/" always;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        expires -1;
        try_files $uri =404;
    }

    location = /robots.txt {
        expires -1;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}
