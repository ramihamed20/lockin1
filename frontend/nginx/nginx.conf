worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format lockin_json escape=json
        '{"time":"$time_iso8601","remote_addr":"$remote_addr","method":"$request_method",'
        '"uri":"$uri","status":$status,"bytes":$body_bytes_sent,'
        '"request_time":$request_time,"upstream_time":"$upstream_response_time",'
        '"request_id":"$request_id"}';
    access_log /dev/stdout lockin_json;
    error_log /dev/stderr warn;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30s;
    client_header_timeout 15s;
    client_body_timeout 30s;
    send_timeout 60s;
    client_max_body_size 2m;
    client_body_temp_path /tmp/nginx-client;
    proxy_temp_path /tmp/nginx-proxy;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/javascript application/json application/manifest+json application/xml
        image/svg+xml text/css text/plain;

    limit_req_zone $binary_remote_addr zone=lockin_auth:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=lockin_upload:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=lockin_webhook:10m rate=120r/m;
    limit_req_status 429;

    upstream lockin_backend {
        server backend:8000;
        keepalive 32;
    }

    server {
        listen 8080;
        return 308 https://$host$request_uri;
    }

    server {
        listen 8443 ssl;
        http2 on;
        ssl_certificate /run/tls/fullchain.pem;
        ssl_certificate_key /run/tls/privatekey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:TLS:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        root /usr/share/nginx/html;
        index index.html;

        add_header Strict-Transport-Security "max-age=3600; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; media-src 'self' blob:" always;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location = /api/v1/health/live {
            proxy_pass http://lockin_backend;
            include /etc/nginx/lockin_proxy.conf;
        }

        location ^~ /api/v1/auth/ {
            limit_req zone=lockin_auth burst=20 nodelay;
            proxy_pass http://lockin_backend;
            include /etc/nginx/lockin_proxy.conf;
        }

        location ^~ /api/v1/management/files {
            client_max_body_size 110m;
            limit_req zone=lockin_upload burst=3 nodelay;
            proxy_request_buffering off;
            proxy_pass http://lockin_backend;
            include /etc/nginx/lockin_proxy.conf;
        }

        location ^~ /api/v1/billing/webhooks/ {
            client_max_body_size 64k;
            limit_req zone=lockin_webhook burst=30 nodelay;
            proxy_pass http://lockin_backend;
            include /etc/nginx/lockin_proxy.conf;
        }

        location ^~ /api/ {
            proxy_pass http://lockin_backend;
            include /etc/nginx/lockin_proxy.conf;
            proxy_connect_timeout 5s;
            proxy_read_timeout 65s;
            proxy_send_timeout 65s;
        }

        location ^~ /admin/ {
            return 404;
        }

        location /static/ {
            alias /srv/lockin/static/;
            access_log off;
            expires max;
        }

        location = /sw.js {
            expires -1;
            try_files $uri =404;
        }

        location /assets/ {
            access_log off;
            expires max;
            try_files $uri =404;
        }

        location / {
            expires -1;
            try_files $uri $uri/ /index.html;
        }
    }
}
