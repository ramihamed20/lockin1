# No `user` directive on purpose. The master already runs unprivileged (see
# frontend/Dockerfile), where nginx ignores this directive anyway -- and setting
# it under a root master is what makes nginx chown its temporary-path
# directories at start-up, which cannot succeed once CAP_CHOWN is dropped.
worker_processes auto;
# The only writable paths are the ones below, all inside the container's tmpfs.
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Never write query strings here. OAuth callbacks and account-action links
  # carry short-lived credentials in their query parameters.
  log_format main '$remote_addr [$time_local] '
                  '"$request_method $uri $server_protocol" '
                  '$status $body_bytes_sent request_time=$request_time '
                  'upstream_time=$upstream_response_time "$http_user_agent"';
  access_log /dev/stdout main;
  error_log /dev/stderr warn;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  server_tokens off;

  # Capacity protection for streamed private files.
  #
  # /api/v1/files/ streams through Gunicorn and holds a worker thread for the
  # whole client transfer -- deliberately, because buffering a 50 MB PDF into the
  # container's small tmpfs is worse. The consequence is that concurrent slow
  # downloads are the cheapest way to exhaust the pool: at 3 workers x 8 threads
  # a few dozen parked transfers starve every other request in the product.
  #
  # These two zones bound that without touching authorisation, which stays in
  # Django. Keys are the resolved client address from cloudflare-real-ip.conf,
  # so a caller cannot spread itself across keys with a forged header.
  #
  # The numbers are set around how pdf.js actually reads: it opens a document
  # with a burst of small Range requests and then fetches ranges as the reader
  # scrolls. A rate that a normal reader trips is worse than no rate limit at
  # all, so the sustained rate is generous and the burst is large.
  limit_req_zone $binary_remote_addr zone=lockin_files:10m rate=30r/s;
  limit_conn_zone $binary_remote_addr zone=lockin_file_conns:10m;
  limit_req_status 429;
  limit_conn_status 429;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  include /etc/nginx/conf.d/*.conf;
}
