user nginx;
worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Never write query strings here. OAuth callbacks and account-action links
  # carry short-lived credentials in their query parameters.
  log_format main '$remote_addr [$time_local] '
                  '"$request_method $uri $server_protocol" '
                  '$status $body_bytes_sent request_time=$request_time '
                  'upstream_time=$upstream_response_time "$http_user_agent"';
  access_log /dev/stdout main;
  error_log /dev/stderr warn;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  server_tokens off;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  include /etc/nginx/conf.d/*.conf;
}
